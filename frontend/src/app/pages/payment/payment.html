<div class="container mt-5">

  <h2 class="mb-4">
    Complete Payment
  </h2>

  <div class="row">

    <div class="col-md-8">

      <div class="card p-4 shadow">

        <h5>
          Payment Method
        </h5>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            checked>
          <label
            class="form-check-label">
            UPI
          </label>
        </div>

        <input
          class="form-control mt-3"
          placeholder="Enter UPI ID">

        <button
          class="btn btn-success mt-3 w-100"
          [disabled]="loading"
          (click)="payNow()">

          {{ loading
             ? 'Processing...'
             : 'Pay ₹' + totalAmount }}

        </button>

      </div>

    </div>

    <div class="col-md-4">

      <div class="card p-4 shadow">

        <h5>
          Booking Summary
        </h5>

        <hr>

        <p>

          <strong>Bus:</strong>

          {{ bus.busName }}

        </p>

        <p>

          <strong>Route:</strong>

          {{ bus.source }}
          →
          {{ bus.destination }}

        </p>

        <p>

          <strong>Seats:</strong>

          {{ seats.join(', ') }}

        </p>

        <p>

          <strong>Passenger:</strong>

          {{ passenger.fullName }}

        </p>

        <h4 class="text-success">

          ₹{{ totalAmount }}

        </h4>

      </div>

    </div>

  </div>

</div>
